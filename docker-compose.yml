version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: telemetria-db
    restart: always
    environment:
      MYSQL_DATABASE: telemetria
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-dev
    container_name: telemetria-backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ''
      DB_NAME: telemetria
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile-dev
    container_name: telemetria-frontend
    restart: always
    ports:
      - '4200:4200'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
