<div style="padding: 20px; max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 15px;">
        <a routerLink="/dashboard" style="color: #0056b3; text-decoration: none; font-size: 14px; cursor: pointer;">← Voltar ao Dashboard</a>
    </div>
    <h2>Lançamento de Leituras</h2>

    <div style="border: 1px solid #ccc; border-radius: 8px; padding: 20px;">
        <form [formGroup]="leituraForm" (ngSubmit)="salvarLeitura()">

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Selecione o Medidor:</label>
                <select formControlName="medidorId" style="width: 100%; padding: 8px;">
                    <option value="" disabled selected>Escolha um medidor...</option>

                    <!-- Novo Control Flow (@for) substituindo o *ngFor -->
                    @for (m of medidores(); track m.id) {
                    <option [value]="m.id">
                        {{ m.identificador }} ({{ m.tipo }}) - {{ m.imovel?.nome }}
                    </option>
                    } @empty {
                    <option disabled>Nenhum medidor encontrado</option>
                    }
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Valor do Consumo:</label>
                <input formControlName="valor" type="number" step="0.01" style="width: 100%; padding: 8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Data/Hora (Opcional):</label>
                <input formControlName="dataHora" type="datetime-local" style="width: 100%; padding: 8px;">
            </div>

            <button type="submit" [disabled]="leituraForm.invalid" style="padding: 10px 20px; cursor: pointer;">
                Registrar Leitura
            </button>

        </form>
    </div>
</div>
