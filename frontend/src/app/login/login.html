<div style="padding: 20px; max-width: 400px; margin: 60px auto;">
  <div style="border: 1px solid #ccc; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; text-align: center;">
      {{ isCadastro ? 'Criar Conta' : 'Login' }}
    </h2>

    <div *ngIf="mensagemErro" style="background: #fee; color: #c00; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center;">
      {{ mensagemErro }}
    </div>

    <div *ngIf="mensagemSucesso" style="background: #e6fffa; color: #047481; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center;">
      {{ mensagemSucesso }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submeter()">
      <div *ngIf="isCadastro" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Nome:</label>
        <input formControlName="nome" type="text" placeholder="Seu nome completo" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 600;">E-mail:</label>
        <input formControlName="email" type="email" placeholder="seu@email.com" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 600;">Senha:</label>
        <input formControlName="senha" type="password" placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
        {{ isCadastro ? 'Cadastrar e Entrar' : 'Entrar' }}
      </button>

      <div style="margin-top: 18px; text-align: center; font-size: 14px;">
        <a href="javascript:void(0)" (click)="alternarModo()" style="color: #007bff; text-decoration: none; cursor: pointer;">
          {{ isCadastro ? 'Já possui uma conta? Faça Login' : 'Não tem uma conta? Cadastre-se' }}
        </a>
      </div>
    </form>
  </div>
</div>
